<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Bulma CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .error-code {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #485fc7, #00d1b2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-card {
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .floating-icon {
            font-size: 3.5rem;
            color: #485fc7;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="has-background-light">
    <section class="hero is-fullheight">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-10-tablet is-8-desktop is-6-widescreen">
                        
                        <div class="card error-card p-5 p-6-desktop has-text-centered has-background-white">
                            <!-- Floating Visual Indicator -->
                            <div class="mb-4">
                                <span class="floating-icon">
                                    <i class="fa-solid fa-compass"></i>
                                </span>
                            </div>

                            <!-- Error Code -->
                            <div class="error-code mb-2">404</div>

                            <!-- Headings -->
                            <h1 class="title is-3 has-text-dark mb-2">Lost in Cyberspace?</h1>
                            <p class="subtitle is-6 has-text-grey mb-5">
                                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                            </p>

                            <hr class="my-4" style="background-color: #f0f0f0;">

                            <!-- Action Buttons -->
                            <div class="buttons is-centered">
                                <a href="/" class="button is-primary is-medium is-rounded px-5">
                                    <span class="icon">
                                        <i class="fa-solid fa-house"></i>
                                    </span>
                                    <span>Take Me Home</span>
                                </a>
                                <button onclick="window.history.back()" class="button is-light is-medium is-rounded px-5">
                                    <span class="icon">
                                        <i class="fa-solid fa-arrow-left"></i>
                                    </span>
                                    <span>Go Back</span>
                                </button>
                            </div>

                            <!-- Optional Dynamic Django Footer / Links -->
                            <div class="mt-5">
                                <p class="is-size-7 has-text-grey-light">
                                    Need help? <a href="/contact/" class="has-text-grey">Contact Support</a>
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
