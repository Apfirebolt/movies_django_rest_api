{% load static %}
<header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand / Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a class="text-xl font-bold tracking-tight flex items-center" href="/">
          <span class="text-primary mr-0.5">Soft</span><span class="text-white">Genie</span>
        </a>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
        <a href="/features" class="hover:text-brand-light transition-colors">Features</a>
        <a href="/pricing" class="hover:text-brand-light transition-colors">Pricing</a>
      </nav>

      <!-- Right Side Actions / CTA (Desktop) -->
      <div class="hidden md:flex items-center space-x-4">
        {% if user.is_authenticated %}
          <span class="text-xs font-medium text-primary bg-primary/10 px-3 py-1.5 rounded-full">
            {{ user.email }}
          </span>
          <form method="post" action="{% url 'accounts:logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="text-xs font-medium text-slate-400 hover:text-white transition-colors">
              Log out
            </button>
          </form>
        {% else %}
          <a
            class="text-xs font-semibold text-slate-300 hover:text-white transition-colors px-3 py-2"
            href="{% url 'accounts:login' %}"
          >
            Log in
          </a>
          <a
            class="bg-primary hover:bg-indigo-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all"
            href="{% url 'accounts:register' %}"
          >
            Get Started
          </a>
        {% endif %}
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden">
        <button
          type="button"
          id="mobile-menu-button"
          class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none transition"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <!-- Icon for Menu -->
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu Collapsible Panel -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-slate-800 bg-slate-900 px-4 pt-4 pb-6 space-y-4 shadow-xl">
    <div class="flex flex-col space-y-3 text-sm font-medium text-slate-300">
      <a href="/features" class="hover:text-brand-light transition-colors">Features</a>
      <a href="/pricing" class="hover:text-brand-light transition-colors">Pricing</a>
    </div>

    <hr class="border-slate-800">

    <div class="flex flex-col space-y-3 pt-2">
      {% if user.is_authenticated %}
        <span class="text-xs font-medium text-primary">
          {{ user.email }}
        </span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="w-full text-left text-xs font-medium text-slate-400 hover:text-white transition-colors py-1">
            Log out
          </button>
        </form>
      {% else %}
        <a
          class="text-center text-xs font-semibold text-slate-300 hover:text-white py-2 border border-slate-800 rounded-xl"
          href="{% url 'accounts:login' %}"
        >
          Log in
        </a>
        <a
          class="text-center bg-primary hover:bg-indigo-900 text-white text-xs font-semibold py-2.5 rounded-xl shadow-sm transition-all"
          href="{% url 'accounts:register' %}"
        >
          Get Started
        </a>
      {% endif %}
    </div>
  </div>
</header>

<!-- JavaScript for Mobile Menu Toggle -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("mobile-menu-button");
    const menu = document.getElementById("mobile-menu");

    if (btn && menu) {
      btn.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });
    }
  });
</script>
