    <!-- Brand / Logo & Mobile Burger -->
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold is-size-4" href="/">
        <!-- Replace with <img src="{% static 'images/logo.png' %}" alt="SoftGenie"> if using an image -->
        <span class="has-text-primary mr-1">Soft</span>Genie
      </a>

      <!-- Accessible Hamburger Menu for Mobile -->
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mainNavbar">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <!-- Collapsible Menu -->
    <div id="mainNavbar" class="navbar-menu night-color-bg">
      <div class="navbar-start">
        <a class="navbar-item" href="/features">Features</a>
        <a class="navbar-item" href="/pricing">Pricing</a>

        <!-- Dropdown Example -->
        <div class="navbar-item has-dropdown is-hoverable">
          <a class="navbar-link">Resources</a>
          <div class="navbar-dropdown is-boxed">
            <a class="navbar-item" href="/docs">Documentation</a>
            <a class="navbar-item" href="/blog">Engineering Blog</a>

            </a>

  </div>
</nav>

<!-- JavaScript to activate Bulma Mobile Burger Toggle -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

    $navbarBurgers.forEach(el => {
      el.addEventListener('click', () => {
        const target = el.dataset.target;
        const $target = document.getElementById(target);

        el.classList.toggle('is-active');
        $target.classList.toggle('is-active');
      });
    });
  });
</script>
