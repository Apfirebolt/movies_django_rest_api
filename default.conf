# 1. HTTP: Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name softgenie.org www.softgenie.org;

    return 301 https://$host$request_uri;
}

# 2. HTTPS: SSL termination and Django proxying
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name softgenie.org www.softgenie.org;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/softgenie.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softgenie.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow larger file uploads (e.g. 20MB, adjust as needed)
    client_max_body_size 20M;

    # Django Static Files (served directly by Nginx)
    location /static/ {
        alias /home/movies_django_rest_api/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Django Media / Uploaded Files (if applicable)
    location /media/ {
        alias /home/movies_django_rest_api/media/;
        expires 30d;
        access_log off;
    }

    # Pass all other requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}